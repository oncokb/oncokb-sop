name: PR Docker Build & Test

on:
  pull_request:
    branches:
      - master

jobs:
  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build (multi-arch, no push)
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          load: true  # Makes the image available locally for testing
          tags: pr-test:latest

      - name: Smoke Test Container
        run: |
          docker run -d --rm -p 4321:4321 --name oncokb-sop-test pr-test:latest
          sleep 5
          curl --fail http://localhost:4321/health || (echo "Health check failed" && exit 1)
